; Every inbound call on the OJEPH number goes straight to the model.
; Requires Asterisk 18+ with app_audiosocket and func_curl.

[ojeph-inbound]
exten => _X.,1,Answer()
 same => n,Set(CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 ; hand the caller id to OJEPH so it can remember returning callers
 same => n,Set(REG=${CURL(http://127.0.0.1:8090/register?uuid=${CALL_UUID}&cid=${CALLERID(num)})})
 ; optional: play the greeting while the model warms up (assets/ojeph_greeting.*)
 ; same => n,Playback(ojeph_greeting)
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
 same => n,Hangup()

; GSM gateway (SIM cards) calls land here too if the gateway is set to this context.
