; SIP trunk from your Nigerian DID provider (DIDHub / Kata Telecom / Africa's Talking).
; Replace the CAPS values with what the provider gives you.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[did-provider]
type=registration
outbound_auth=did-provider-auth
server_uri=sip:PROVIDER_SIP_HOST
client_uri=sip:SIP_USERNAME@PROVIDER_SIP_HOST
retry_interval=60

[did-provider-auth]
type=auth
auth_type=userpass
username=SIP_USERNAME
password=SIP_PASSWORD

[did-provider]
type=aor
contact=sip:PROVIDER_SIP_HOST

[did-provider]
type=endpoint
context=ojeph-inbound
disallow=all
allow=alaw,ulaw
outbound_auth=did-provider-auth
aors=did-provider
direct_media=no

[did-provider]
type=identify
endpoint=did-provider
match=PROVIDER_SIP_HOST
